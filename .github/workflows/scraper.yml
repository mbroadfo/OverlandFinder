name: Scraper & Evaluator

on:
  schedule:
    - cron: '0 6,18 * * *'  # Twice daily: 6 AM and 6 PM UTC (midnight and noon MDT)
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: "."
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  scraper:
    name: Scrape & Evaluate
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Craigslist scraper
        run: python src/scrapers/craigslist_scraper.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Run eBay scraper
        run: python src/scrapers/ebay_scraper.py
        env:
          MONGODB_URI:    ${{ secrets.MONGODB_URI }}
          EBAY_APP_ID:    ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID:   ${{ secrets.EBAY_CERT_ID }}

      - name: Run evaluator
        run: python src/evaluator/deal_evaluator.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}
