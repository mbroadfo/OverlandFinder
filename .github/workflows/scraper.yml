name: Scraper & Evaluator

on:
  schedule:
    - cron: '0 6,18 * * *'  # Twice daily: 6 AM and 6 PM UTC (midnight and noon MDT)
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: "."
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  scraper:
    name: Scrape & Evaluate
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (cached run)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run Craigslist scraper
        run: python src/scrapers/craigslist_scraper.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Run eBay scraper
        run: python src/scrapers/ebay_scraper.py
        env:
          MONGODB_URI:    ${{ secrets.MONGODB_URI }}
          EBAY_APP_ID:    ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID:   ${{ secrets.EBAY_CERT_ID }}

      - name: Run Facebook Marketplace scraper
        run: python src/scrapers/facebook_scraper.py
        env:
          MONGODB_URI:  ${{ secrets.MONGODB_URI }}
          FB_COOKIES:   ${{ secrets.FB_COOKIES }}

      - name: Check for expired deals
        run: python src/jobs/deal_expiry.py
        env:
          MONGODB_URI:  ${{ secrets.MONGODB_URI }}
          EBAY_APP_ID:  ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID: ${{ secrets.EBAY_CERT_ID }}

      - name: Run evaluator
        run: python src/evaluator/deal_evaluator.py
        env:
          MONGODB_URI:       ${{ secrets.MONGODB_URI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EBAY_APP_ID:       ${{ secrets.EBAY_APP_ID }}
          EBAY_CERT_ID:      ${{ secrets.EBAY_CERT_ID }}

      - name: DB Report
        if: always()
        run: python scripts/db_report.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
