name: Scraper & Evaluator

on:
  schedule:
    - cron: '30 */4 * * *'  # Every 4 hours at :30 past
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  PYTHONPATH: "."

permissions:
  contents: read

jobs:
  scraper:
    name: Scrape & Evaluate
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python src/scrapers/craigslist_scraper.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}

      - name: Run evaluator
        run: python src/evaluator/deal_evaluator.py
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
