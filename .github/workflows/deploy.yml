name: Deploy Infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lint with ruff
        run: pip install ruff && ruff check . --output-format=github
        continue-on-error: true
      - name: Run tests
        run: pytest tests/ -v --tb=short -q
        continue-on-error: true
        env:
          MONGODB_URI: "mongodb://localhost:27017/test"
          ANTHROPIC_API_KEY: "test-key-not-used-in-unit-tests"

  deploy:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: test
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: infrastructure/terraform
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC:        "true"
        run: terraform init

      - name: Terraform Apply
        working-directory: infrastructure/terraform
        env:
          ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC:        "true"
          TF_VAR_project_name: "overland-finder"
          TF_VAR_environment:  "dev"
          TF_VAR_location:     "eastus"
        run: terraform apply -auto-approve

      # Secret values are pushed directly — never stored in Terraform state
      - name: Push secrets to Key Vault
        env:
          MONGODB_URI:       ${{ secrets.MONGODB_URI }}
          SMTP_USERNAME:     ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          az keyvault secret set --vault-name kv-overland-finder-dev --name mongodb-uri        --value "$MONGODB_URI"       --output none
          az keyvault secret set --vault-name kv-overland-finder-dev --name smtp-username      --value "$SMTP_USERNAME"     --output none
          az keyvault secret set --vault-name kv-overland-finder-dev --name smtp-password      --value "$SMTP_PASSWORD"     --output none
          az keyvault secret set --vault-name kv-overland-finder-dev --name anthropic-api-key  --value "$ANTHROPIC_API_KEY" --output none
